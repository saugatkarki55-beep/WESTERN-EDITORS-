<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESTERN EDITORS</title>

    <!-- Analytics Tracking (GoatCounter) -->
    <script data-goatcounter="https://westerneditors.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #04060d;
            --blue-accent: #00a2ff;
            --blue-glow: #0066ff;
            --red-glow: #ff003c;
            --text-white: #ffffff;
            --text-muted: #8ea5c0;
            --fb-blue: #1877f2;
            --tiktok-pink: #ff0050;
            --tiktok-blue: #00f2fe;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
            background-image: 
                radial-gradient(circle at 50% 18%, rgba(255, 0, 60, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 102, 255, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(0, 242, 254, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Background Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Grid Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Top Right Real-Time Stats (Admin View Only) */
        .stats-badge {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 35, 0.88);
            border: 1px solid rgba(0, 162, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 20px;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--text-muted);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 162, 255, 0.3);
            z-index: 10;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-item i {
            color: var(--blue-accent);
        }

        .stats-item span {
            color: var(--text-white);
            font-weight: 700;
        }

        /* 3D Main Container */
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        header {
            margin-bottom: 35px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* 3D Interactive Floating Logo Ring */
        .logo-wrapper {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--red-glow), var(--blue-accent), var(--tiktok-blue));
            margin-bottom: 22px;
            transform-style: preserve-3d;
            transform: translateZ(40px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.85),
                0 0 30px rgba(255, 0, 60, 0.5),
                inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float3D 4s ease-in-out infinite alternate;
            cursor: pointer;
        }

        .logo-wrapper:hover {
            transform: translateZ(60px) scale(1.08);
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(255, 0, 60, 0.8),
                inset 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .logo-wrapper:active {
            transform: translateZ(30px) scale(0.96);
        }

        @keyframes float3D {
            0% { transform: translateZ(40px) translateY(0px) rotateX(0deg); }
            100% { transform: translateZ(55px) translateY(-8px) rotateX(6deg); }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #000;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }

        /* 3D Extruded Brand Title with Internal Red Light Sweep */
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            transform: translateZ(35px);
            position: relative;
            
            /* Internal Metallic Gradient Text Base */
            background: linear-gradient(
                110deg, 
                #ffffff 0%, 
                #ffffff 35%, 
                #ff003c 50%, 
                #ffffff 65%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: redShineSweep 3.5s linear infinite;
            
            /* Outer Glowing Perspective Dropshadow */
            filter: drop-shadow(0 4px 10px rgba(255, 0, 60, 0.5));
        }

        @keyframes redShineSweep {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .divider {
            height: 3px;
            width: 85px;
            background: linear-gradient(90deg, transparent, var(--red-glow), var(--blue-accent), transparent);
            margin: 0 auto 16px auto;
            border-radius: 3px;
            transform: translateZ(25px);
            box-shadow: 0 0 12px var(--red-glow);
        }

        /* Subtitle */
        .tagline {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--blue-accent);
            text-transform: uppercase;
            line-height: 1.6;
            transform: translateZ(30px);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 12px rgba(0, 162, 255, 0.5);
        }

        /* 3D Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transform-style: preserve-3d;
        }

        /* 3D Physical Push Button */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-white);
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(145deg, rgba(20, 35, 60, 0.85), rgba(8, 16, 30, 0.95));
            border: 1px solid rgba(0, 162, 255, 0.35);
            box-shadow: 
                0 8px 0 #003b70,
                0 15px 25px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform: translateZ(25px);
            -webkit-tap-highlight-color: transparent;
        }

        .btn i {
            font-size: 1.45rem;
            margin-right: 14px;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .btn-facebook .fa-facebook {
            color: var(--fb-blue);
        }

        .btn-tiktok .fa-tiktok {
            color: var(--text-white);
            filter: drop-shadow(-2px 0 0 var(--tiktok-pink)) drop-shadow(2px 0 0 var(--tiktok-blue));
        }

        .btn:hover {
            transform: translateZ(32px) translateY(-3px);
            border-color: var(--blue-accent);
            box-shadow: 
                0 11px 0 #004b8d,
                0 20px 30px rgba(0, 162, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, rgba(28, 48, 80, 0.9), rgba(10, 22, 42, 0.95));
        }

        .btn:active {
            transform: translateZ(15px) translateY(5px);
            box-shadow: 
                0 3px 0 #002244,
                0 5px 12px rgba(0, 0, 0, 0.9),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .btn:hover i {
            transform: scale(1.2) rotate(-3deg);
        }

        /* ------------------------------------
           Cinematic 3D Popup Modal Overlay
        ------------------------------------ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 6, 13, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(16, 28, 50, 0.95), rgba(6, 12, 24, 0.98));
            border: 2px solid var(--red-glow);
            padding: 35px 28px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            transform: scale(0.6) rotateX(20deg) translateZ(-100px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(255, 0, 60, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) rotateX(0deg) translateZ(0);
        }

        .modal-icon {
            font-size: 2.5rem;
            color: var(--red-glow);
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--red-glow);
            animation: pulseIcon 1.5s infinite alternate;
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px var(--red-glow)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 18px var(--red-glow)); }
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.4;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.6);
        }

        .modal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .modal-close-btn {
            background: linear-gradient(135deg, var(--red-glow), #bb002c);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 60, 0.5);
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 60, 0.7);
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 115px;
                height: 115px;
            }

            .brand-name {
                font-size: 1.7rem;
                letter-spacing: 3px;
            }

            .tagline {
                font-size: 0.74rem;
                letter-spacing: 1.4px;
            }

            .btn {
                padding: 16px 20px;
                font-size: 0.95rem;
            }

            .modal-title {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Top Right Real-Time Stats (Admin View Only) -->
    <div class="stats-badge" id="admin-badge">
        <div class="stats-item">
            <i class="fa-regular fa-eye"></i> Visits: <span id="visit-count">...</span>
        </div>
        <div class="stats-item">
            <i class="fa-solid fa-arrow-pointer"></i> Followed: <span id="click-count">...</span>
        </div>
    </div>

    <!-- 3D Main Wrapper Container -->
    <main class="container" id="card-container">
        <!-- Header -->
        <header>
            <div class="logo-wrapper" id="logo-btn" title="Click for Interactive Message">
                <img src="logo.png" alt="Western Editors Logo" class="logo-img">
            </div>
            <h1 class="brand-name">Western Editors</h1>
            <div class="divider"></div>
            <p class="tagline">Professional Photo &bull; Cinematic Video &bull; Drone Coverage</p>
        </header>

        <!-- Social Links -->
        <section class="links-container">
            <a href="https://www.facebook.com/share/1Fsm7AVcDf/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="btn btn-facebook" id="fb-btn">
                <i class="fa-brands fa-facebook"></i>
                <span>Follow us on Facebook</span>
            </a>

            <a href="https://www.tiktok.com/@westerneditorsofficial?_r=1&_t=ZS-99OFlWix6eN" target="_blank" rel="noopener noreferrer" class="btn btn-tiktok" id="tt-btn">
                <i class="fa-brands fa-tiktok"></i>
                <span>Follow us on TikTok</span>
            </a>
        </section>
    </main>

    <!-- Cinematic Pop-Up Modal -->
    <div class="modal-overlay" id="thankyou-modal">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-clapperboard"></i>
            </div>
            <h2 class="modal-title">THANK YOU FOR CHOOSING WESTERN EDITORS!</h2>
            <p class="modal-sub">We bring your vision to life with cinematic precision & professional storytelling.</p>
            <button class="modal-close-btn" id="modal-close">CONTINUE</button>
        </div>
    </div>

    <script>
        /* ------------------------------------
           1. Web Audio API Cinematic Sound Engine
        ------------------------------------ */
        function playCinematicSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();

                // Synth Low Bass Riser
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, audioCtx.currentTime); // Low freq
                osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.4); // Riser pitch

                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                // Audio context fallback
            }
        }

        /* ------------------------------------
           2. Logo Click Pop-Up Modal Handlers
        ------------------------------------ */
        const logoBtn = document.getElementById('logo-btn');
        const modal = document.getElementById('thankyou-modal');
        const modalClose = document.getElementById('modal-close');

        logoBtn.addEventListener('click', () => {
            playCinematicSound();
            modal.classList.add('active');
        });

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        /* ------------------------------------
           3. Mouse 3D Tilt Effect
        ------------------------------------ */
        const card = document.getElementById('card-container');
        
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* ------------------------------------
           4. Strict Admin View Control
        ------------------------------------ */
        const urlParams = new URLSearchParams(window.location.search);
        localStorage.removeItem('isAdmin');

        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-badge').style.display = 'flex';
            fetchLiveStats();
        } else {
            document.getElementById('admin-badge').style.display = 'none';
        }

        /* ------------------------------------
           5. Click Analytics Tracking
        ------------------------------------ */
        document.getElementById('fb-btn').addEventListener('click', function() {
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({
                    path: 'click-facebook',
                    title: 'Facebook Clicked',
                    event: true
                });
            }
        });

        document.getElementById('tt-btn').addEventListener('click', function() {
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({
                    path: 'click-tiktok',
                    title: 'TikTok Clicked',
                    event: true
                });
            }
        });

        /* ------------------------------------
           6. Analytics API Fetching
        ------------------------------------ */
        async function fetchLiveStats() {
            try {
                const totalRes = await fetch('https://westerneditors.goatcounter.com/counter/TOTAL.json');
                const totalData = await totalRes.json();
                document.getElementById('visit-count').innerText = totalData.count || '0';

                const fbRes = await fetch('https://westerneditors.goatcounter.com/counter/click-facebook.json');
                const ttRes = await fetch('https://westerneditors.goatcounter.com/counter/click-tiktok.json');
                
                let fbClicks = 0;
                let ttClicks = 0;

                if (fbRes.ok) {
                    const fbData = await fbRes.json();
                    fbClicks = parseInt(fbData.count) || 0;
                }
                if (ttRes.ok) {
                    const ttData = await ttRes.json();
                    ttClicks = parseInt(ttData.count) || 0;
                }

                document.getElementById('click-count').innerText = (fbClicks + ttClicks);
            } catch (err) {
                document.getElementById('visit-count').innerText = '1+';
                document.getElementById('click-count').innerText = '0';
            }
        }

        /* ------------------------------------
           7. Background Particle Canvas
        ------------------------------------ */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = {
            x: null,
            y: null,
            radius: 120
        };

        window.addEventListener('mousemove', function(e) {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', function() {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = Math.random() > 0.5 ? 'rgba(255, 0, 60, ' : 'rgba(0, 162, 255, ';
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= dx * 0.02;
                        this.y -= dy * 0.02;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255, 0, 60, 0.8)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a + 1; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        let opacity = 1 - (distance / 110);
                        ctx.strokeStyle = `rgba(0, 162, 255, ${opacity * 0.18})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
