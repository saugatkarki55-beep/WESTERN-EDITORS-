<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESTERN EDITORS</title>

    <script data-goatcounter="https://westerneditors.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050811;
            --card-bg: rgba(12, 22, 40, 0.65);
            --blue-accent: #00a2ff;
            --blue-glow: #0066ff;
            --text-white: #ffffff;
            --text-muted: #8ea5c0;
            --fb-blue: #1877f2;
            --tiktok-pink: #ff0050;
            --tiktok-blue: #00f2fe;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
            background-image: 
                radial-gradient(circle at 50% 18%, rgba(0, 162, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 102, 255, 0.18) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(0, 242, 254, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Particle Canvas Styling */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Overlay Grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Top Right Real-Time Stats (Admin View) */
        .stats-badge {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 35, 0.88);
            border: 1px solid rgba(0, 162, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 20px;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--text-muted);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 162, 255, 0.3);
            z-index: 10;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-item i {
            color: var(--blue-accent);
        }

        .stats-item span {
            color: var(--text-white);
            font-weight: 700;
        }

        /* 3D Main Container Wrapper */
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        header {
            margin-bottom: 35px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* 3D Floating Logo Ring */
        .logo-wrapper {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--blue-accent), #0033aa, var(--tiktok-blue));
            margin-bottom: 22px;
            transform-style: preserve-3d;
            transform: translateZ(40px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(0, 162, 255, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float3D 4s ease-in-out infinite alternate;
        }

        @keyframes float3D {
            0% { transform: translateZ(40px) translateY(0px) rotateX(0deg); }
            100% { transform: translateZ(55px) translateY(-8px) rotateX(6deg); }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #000;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* 3D Extruded Brand Title */
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: uppercase;
            transform: translateZ(35px);
            /* 3D Text Shadow Extrusion */
            text-shadow: 
                0 1px 0 #0088cc,
                0 2px 0 #0066aa,
                0 3px 0 #004488,
                0 4px 0 #002266,
                0 5px 12px rgba(0, 0, 0, 0.9),
                0 0 25px rgba(0, 162, 255, 0.6);
        }

        .divider {
            height: 3px;
            width: 80px;
            background: linear-gradient(90deg, transparent, var(--blue-accent), transparent);
            margin: 0 auto 16px auto;
            border-radius: 3px;
            transform: translateZ(25px);
            box-shadow: 0 0 10px var(--blue-accent);
        }

        /* 3D Subtitle */
        .tagline {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--blue-accent);
            text-transform: uppercase;
            line-height: 1.6;
            transform: translateZ(30px);
            text-shadow: 
                0 2px 4px rgba(0,0,0,0.8),
                0 0 12px rgba(0, 162, 255, 0.5);
        }

        /* 3D Buttons Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transform-style: preserve-3d;
        }

        /* 3D Physical Push Button Style */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-white);
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(145deg, rgba(20, 35, 60, 0.85), rgba(8, 16, 30, 0.95));
            border: 1px solid rgba(0, 162, 255, 0.35);
            /* Physical 3D Extrusive Bottom Edge */
            box-shadow: 
                0 8px 0 #003b70,
                0 15px 25px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform: translateZ(25px);
            -webkit-tap-highlight-color: transparent;
        }

        .btn i {
            font-size: 1.45rem;
            margin-right: 14px;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .btn-facebook .fa-facebook {
            color: var(--fb-blue);
        }

        .btn-tiktok .fa-tiktok {
            color: var(--text-white);
            filter: drop-shadow(-2px 0 0 var(--tiktok-pink)) drop-shadow(2px 0 0 var(--tiktok-blue));
        }

        /* 3D Hover & Active Physical Press Mechanics */
        .btn:hover {
            transform: translateZ(32px) translateY(-3px);
            border-color: var(--blue-accent);
            box-shadow: 
                0 11px 0 #004b8d,
                0 20px 30px rgba(0, 162, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, rgba(28, 48, 80, 0.9), rgba(10, 22, 42, 0.95));
        }

        .btn:active {
            transform: translateZ(15px) translateY(5px);
            /* Button depresses down */
            box-shadow: 
                0 3px 0 #002244,
                0 5px 12px rgba(0, 0, 0, 0.9),
                inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .btn:hover i {
            transform: scale(1.2) rotate(-3deg);
        }

        @media (max-width: 480px) {
            .logo-wrapper {
                width: 115px;
                height: 115px;
            }

            .brand-name {
                font-size: 1.75rem;
                letter-spacing: 3px;
            }

            .tagline {
                font-size: 0.74rem;
                letter-spacing: 1.4px;
            }

            .btn {
                padding: 16px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="stats-badge" id="admin-badge">
        <div class="stats-item">
            <i class="fa-regular fa-eye"></i> Visits: <span id="visit-count">...</span>
        </div>
        <div class="stats-item">
            <i class="fa-solid fa-arrow-pointer"></i> Followed: <span id="click-count">...</span>
        </div>
    </div>

    <main class="container" id="card-container">
        <header>
            <div class="logo-wrapper">
                <img src="logo.png" alt="Western Editors Logo" class="logo-img">
            </div>
            <h1 class="brand-name">Western Editors</h1>
            <div class="divider"></div>
            <p class="tagline">Professional Photo &bull; Cinematic Video &bull; Drone Coverage</p>
        </header>

        <section class="links-container">
            <a href="https://www.facebook.com/share/1Fsm7AVcDf/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="btn btn-facebook" id="fb-btn">
                <i class="fa-brands fa-facebook"></i>
                <span>Follow us on Facebook</span>
            </a>

            <a href="https://www.tiktok.com/@westerneditorsofficial?_r=1&_t=ZS-99OFlWix6eN" target="_blank" rel="noopener noreferrer" class="btn btn-tiktok" id="tt-btn">
                <i class="fa-brands fa-tiktok"></i>
                <span>Follow us on TikTok</span>
            </a>
        </section>
    </main>

    <script>
        /* ------------------------------------
           1. Dynamic Mouse 3D Tilt Effect
        ------------------------------------ */
        const card = document.getElementById('card-container');
        
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* ------------------------------------
           2. Strict Admin View Control
        ------------------------------------ */
        const urlParams = new URLSearchParams(window.location.search);
        localStorage.removeItem('isAdmin');

        if (urlParams.get('admin') === 'true') {
            document.getElementById('admin-badge').style.display = 'flex';
            fetchLiveStats();
        } else {
            document.getElementById('admin-badge').style.display = 'none';
        }

        /* ------------------------------------
           3. Click Analytics Tracking
        ------------------------------------ */
        document.getElementById('fb-btn').addEventListener('click', function() {
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({
                    path: 'click-facebook',
                    title: 'Facebook Clicked',
                    event: true
                });
            }
        });

        document.getElementById('tt-btn').addEventListener('click', function() {
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({
                    path: 'click-tiktok',
                    title: 'TikTok Clicked',
                    event: true
                });
            }
        });

        /* ------------------------------------
           4. Analytics API Fetching
        ------------------------------------ */
        async function fetchLiveStats() {
            try {
                const totalRes = await fetch('https://westerneditors.goatcounter.com/counter/TOTAL.json');
                const totalData = await totalRes.json();
                document.getElementById('visit-count').innerText = totalData.count || '0';

                const fbRes = await fetch('https://westerneditors.goatcounter.com/counter/click-facebook.json');
                const ttRes = await fetch('https://westerneditors.goatcounter.com/counter/click-tiktok.json');
                
                let fbClicks = 0;
                let ttClicks = 0;

                if (fbRes.ok) {
                    const fbData = await fbRes.json();
                    fbClicks = parseInt(fbData.count) || 0;
                }
                if (ttRes.ok) {
                    const ttData = await ttRes.json();
                    ttClicks = parseInt(ttData.count) || 0;
                }

                document.getElementById('click-count').innerText = (fbClicks + ttClicks);
            } catch (err) {
                document.getElementById('visit-count').innerText = '1+';
                document.getElementById('click-count').innerText = '0';
            }
        }

        /* ------------------------------------
           5. Background Particle Canvas
        ------------------------------------ */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = {
            x: null,
            y: null,
            radius: 120
        };

        window.addEventListener('mousemove', function(e) {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', function() {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = Math.random() > 0.5 ? 'rgba(0, 162, 255, ' : 'rgba(0, 242, 254, ';
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= dx * 0.02;
                        this.y -= dy * 0.02;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(0, 162, 255, 0.8)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a + 1; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        let opacity = 1 - (distance / 110);
                        ctx.strokeStyle = `rgba(0, 162, 255, ${opacity * 0.18})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
